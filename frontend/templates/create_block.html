{% extends "base.html" %}
{% block content %}
<h2>Create Block</h2>
<form method="POST">
    <div class="form-group">
        <label for="block_id">Block ID (optional):</label>
        <input type="number" class="form-control" id="block_id" name="block_id">
    </div>
    <button type="submit" class="btn btn-primary">Create Block</button>
</form>
{% endblock %}
