{% extends "base.html" %}
{% block content %}
<h2>Workouts</h2>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Block ID</th>
        </tr>
    </thead>
    <tbody>
        {% for workout in workouts %}
        <tr>
            <td>{{ workout.id }}</td>
            <td>{{ workout.block_id }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
