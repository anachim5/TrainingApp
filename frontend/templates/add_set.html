{% extends "base.html" %}
{% block content %}
<h2>Add Set</h2>
<form method="POST">
    <div class="form-group">
        <label for="workout_id">Workout:</label>
        <select class="form-control" id="workout_id" name="workout_id" required>
            {% for workout in workouts %}
                <option value="{{ workout.id }}">{{ workout.id }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="exercise_id">Exercise:</label>
        <select class="form-control" id="exercise_id" name="exercise_id" required>
            {% for exercise in exercises %}
                <option value="{{ exercise.id }}">{{ exercise.exercise_name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" class="form-control" id="date" name="date" required>
    </div>
    <div class="form-group">
        <label for="weight">Weight:</label>
        <input type="number" step="0.1" class="form-control" id="weight" name="weight" required>
    </div>
    <div class="form-group">
        <label for="repetitions">Repetitions:</label>
        <input type="number" class="form-control" id="repetitions" name="repetitions" required>
    </div>
    <div class="form-group">
        <label for="rpe">RPE (optional):</label>
        <input type="number" step="0.1" class="form-control" id="rpe" name="rpe" min="0" max="10">
    </div>
    <div class="form-group">
        <label for="rir">RIR (optional):</label>
        <input type="number" step="0.1" class="form-control" id="rir" name="rir" min="0" max="10">
    </div>
    </div>
    <button type="submit" class="btn btn-primary">Add Set</button>
</form>
{% endblock %}
