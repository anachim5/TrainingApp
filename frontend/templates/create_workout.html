{% extends "base.html" %}
{% block content %}
<h2>Create Workout</h2>
<form method="POST">
    <div class="form-group">
        <label for="block_id">Block:</label>
        <select class="form-control" id="block_id" name="block_id" required>
            {% for block in blocks %}
                <option value="{{ block.id }}">{{ block.id }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="workout_id">Workout ID (optional):</label>
        <input type="number" class="form-control" id="workout_id" name="workout_id">
    </div>
    <button type="submit" class="btn btn-primary">Create Workout</button>
</form>
{% endblock %}
